name: Build DeutschFun Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev sqlite3 libsqlite3-dev libssl-dev libffi-dev libgdbm-dev build-essential ccache

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Auto-accept Android SDK Licenses & Build APK
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeutschFunPro-APK
        path: bin/*.apk
